<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KT-Impact: SplitExpense</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f7fa;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-container{
            background:white;
            width:400px;
            padding:40px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            color:#2d6cdf;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:25px;
        }

        .input-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }

        input:focus{
            outline:none;
            border-color:#2d6cdf;
            box-shadow:0 0 0 3px rgba(45,108,223,0.15);
        }

        .login-btn{
            width:100%;
            padding:12px;
            background:#2d6cdf;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
            font-weight:bold;
            margin-top:10px;
        }

        .login-btn:hover{
            background:#1f56ba;
        }

        .links{
            margin-top:20px;
            text-align:center;
        }

        .links a{
            text-decoration:none;
            color:#2d6cdf;
            display:block;
            margin-top:10px;
        }

        .links a:hover{
            text-decoration:underline;
        }
    </style>
</head>
<body>

    <div class="login-container">

        <h1>Welcome Back</h1>

        <p>Log in to manage your shared expenses.</p>

        <form action="dashboard.html">

            <div class="input-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">Log In</button>

        </form>

        <div class="links">
            <a href="#">Forgot Password?</a>
            <a href="homepage.html">← Back to Home</a>
        </div>

    </div>

</body>
</html>
