<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - KT-Impact: SplitExpense</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f7fa;
        }

        header{
            background:#2d6cdf;
            color:white;
            padding:20px 8%;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        header h1{
            font-size:26px;
        }

        .logout-btn{
            padding:8px 20px;
            background:white;
            color:#2d6cdf;
            border:none;
            border-radius:6px;
            font-size:14px;
            font-weight:bold;
            cursor:pointer;
            text-decoration:none;
        }

        .logout-btn:hover{
            background:#e8eef8;
        }

        /* three sections stacked vertically */
        .dashboard{
            max-width:800px;
            margin:40px auto;
            padding:0 20px;
            display:flex;
            flex-direction:column;
            gap:30px;
        }

        .card{
            background:white;
            border-radius:12px;
            box-shadow:0 3px 10px rgba(0,0,0,0.08);
            padding:30px;
        }

        .card h2{
            color:#2d6cdf;
            margin-bottom:20px;
            font-size:20px;
            border-bottom:2px solid #e8eef8;
            padding-bottom:10px;
        }

        /* ── Section 1: Add Expense ── */
        .expense-form{
            display:flex;
            flex-direction:column;
            gap:12px;
        }

        .expense-form input{
            padding:11px 14px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }

        .expense-form input:focus{
            outline:none;
            border-color:#2d6cdf;
            box-shadow:0 0 0 3px rgba(45,108,223,0.12);
        }

        .expense-form button{
            padding:12px;
            background:#2d6cdf;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:15px;
            font-weight:bold;
        }

        .expense-form button:hover{ background:#1f56ba; }
        .expense-form button:disabled{ background:#9ab4e8; cursor:not-allowed; }

        .expense-table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        .expense-table th,
        .expense-table td{
            text-align:left;
            padding:10px 12px;
            border-bottom:1px solid #eee;
            font-size:15px;
        }

        .expense-table th{
            background:#f0f4ff;
            color:#2d6cdf;
            font-weight:bold;
        }

        .expense-table tr:last-child td{ border-bottom:none; }

        .status-msg{ font-size:14px; margin-top:8px; min-height:20px; }
        .status-msg.error{ color:#c0392b; }
        .status-msg.success{ color:#27ae60; }

        /* ── Section 2: Who Owes Whom ── */
        .balances{
            display:flex;
            flex-direction:column;
            gap:12px;
        }

        .balance-row{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#f8faff;
            padding:12px 16px;
            border-radius:8px;
            border-left:4px solid #2d6cdf;
        }

        .balance-row .names{ font-size:15px; color:#333; }
        .balance-row .amount{ font-weight:bold; color:#e05c2d; font-size:15px; }
        .no-balances{ color:#888; font-size:15px; }

        /* ── Section 3: Expense History ── */
        .history-list{
            display:flex;
            flex-direction:column;
            gap:10px;
        }

        .history-item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:12px 16px;
            background:#f8faff;
            border-radius:8px;
            font-size:15px;
        }

        .history-item .desc{ color:#333; }
        .history-item .meta{ color:#888; font-size:13px; margin-top:3px; }
        .history-item .hist-amount{ font-weight:bold; color:#2d6cdf; }
        .no-history{ color:#888; font-size:15px; }

        footer{
            text-align:center;
            background:#222;
            color:white;
            padding:20px;
            margin-top:50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>KT-Impact: SplitExpense — Dashboard</h1>
        <a href="homepage.html" class="logout-btn">Log Out</a>
    </header>

    <div class="dashboard">

        <!-- ── Section 1: Expenses, Payer & Amount ── -->
        <div class="card">
            <h2>Add Expense</h2>

            <div class="expense-form">
                <input type="text"   id="expenseDesc"   placeholder="Expense description (e.g. Dinner)">
                <input type="text"   id="expensePayer"  placeholder="Payer's name">
                <input type="number" id="expenseAmount" placeholder="Amount (e.g. 50.00)" min="0" step="0.01">
                <button id="addBtn" onclick="addExpense()">Add Expense</button>
                <span class="status-msg" id="statusMsg"></span>
            </div>

            <table class="expense-table">
                <thead>
                    <tr>
                        <th>Expense</th>
                        <th>Payer</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="expenseBody">
                    <tr><td colspan="3" style="color:#888;">Loading…</td></tr>
                </tbody>
            </table>
        </div>

        <!-- ── Section 2: Who Owes Whom ── -->
        <div class="card">
            <h2>Who Owes Whom</h2>
            <div class="balances" id="balancesSection">
                <p class="no-balances">Loading…</p>
            </div>
        </div>

        <!-- ── Section 3: Expense History ── -->
        <div class="card">
            <h2>Expense History</h2>
            <div class="history-list" id="historyList">
                <p class="no-history">Loading…</p>
            </div>
        </div>

    </div>

    <footer>
        <p>© 2026 KT-Impact: SplitExpense. All Rights Reserved.</p>
    </footer>

    <script>
        const API = 'http://localhost:3000/api';

        async function loadExpenses() {
            const res = await fetch(`${API}/expenses`);
            if (!res.ok) throw new Error('Failed to load expenses.');
            return res.json();
        }

        async function loadBalances() {
            const res = await fetch(`${API}/balances`);
            if (!res.ok) throw new Error('Failed to load balances.');
            return res.json();
        }

        async function saveExpense(desc, payer, amount) {
            const res = await fetch(`${API}/expenses`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ description: desc, payer, amount })
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error || 'Failed to save expense.');
            }
            return res.json();
        }

        function renderExpenses(expenses) {
            const tbody = document.getElementById('expenseBody');
            tbody.innerHTML = '';
            if (!expenses.length) {
                tbody.innerHTML = '<tr><td colspan="3" style="color:#888;">No expenses added yet.</td></tr>';
                return;
            }
            expenses.forEach(e => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${e.description}</td>
                    <td>${e.payer}</td>
                    <td>$${parseFloat(e.amount).toFixed(2)}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function renderBalances(settlements) {
            const section = document.getElementById('balancesSection');
            section.innerHTML = '';
            if (!settlements.length) {
                section.innerHTML = '<p class="no-balances">Everyone is settled up (or no expenses yet).</p>';
                return;
            }
            settlements.forEach(s => {
                const row = document.createElement('div');
                row.className = 'balance-row';
                row.innerHTML = `
                    <span class="names">${s.from} → ${s.to}</span>
                    <span class="amount">owes $${s.amount.toFixed(2)}</span>
                `;
                section.appendChild(row);
            });
        }

        function renderHistory(expenses) {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            if (!expenses.length) {
                list.innerHTML = '<p class="no-history">No expense history yet.</p>';
                return;
            }
            [...expenses].reverse().forEach(e => {
                const date = new Date(e.created_at).toLocaleDateString();
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <div>
                        <div class="desc">${e.description}</div>
                        <div class="meta">Paid by ${e.payer} · ${date}</div>
                    </div>
                    <div class="hist-amount">$${parseFloat(e.amount).toFixed(2)}</div>
                `;
                list.appendChild(item);
            });
        }

        async function refresh() {
            try {
                const [expenses, settlements] = await Promise.all([
                    loadExpenses(),
                    loadBalances()
                ]);
                renderExpenses(expenses);
                renderBalances(settlements);
                renderHistory(expenses);
            } catch (err) {
                console.error(err);
            }
        }

        async function addExpense() {
            const desc   = document.getElementById('expenseDesc').value.trim();
            const payer  = document.getElementById('expensePayer').value.trim();
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            const btn    = document.getElementById('addBtn');
            const msg    = document.getElementById('statusMsg');

            if (!desc || !payer || isNaN(amount) || amount <= 0) {
                msg.textContent = 'Please fill in all fields with valid values.';
                msg.className   = 'status-msg error';
                return;
            }

            btn.disabled    = true;
            msg.textContent = 'Saving…';
            msg.className   = 'status-msg';

            try {
                await saveExpense(desc, payer, amount);
                document.getElementById('expenseDesc').value   = '';
                document.getElementById('expensePayer').value  = '';
                document.getElementById('expenseAmount').value = '';
                msg.textContent = 'Expense saved!';
                msg.className   = 'status-msg success';
                await refresh();
            } catch (err) {
                msg.textContent = 'Error: ' + err.message;
                msg.className   = 'status-msg error';
            } finally {
                btn.disabled = false;
            }
        }

        // initial load
        refresh();
    </script>

</body>
</html>
